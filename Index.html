<!DOCTYPE html>
<html lang="en" data-mode="focus">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro Timer</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<main class="bento">
	<header class="card head">
		<h1>Pomodoro</h1>
		<button id="themeBtn" class="icon-btn" aria-label="Toggle light and dark theme">
			<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
		</button>
	</header>

	<section class="card timer" aria-label="Timer">
		<div class="tabs" role="tablist">
			<button role="tab" class="tab active" data-mode="focus" aria-selected="true">Focus</button>
			<button role="tab" class="tab" data-mode="short" aria-selected="false">Short break</button>
			<button role="tab" class="tab" data-mode="long" aria-selected="false">Long break</button>
		</div>

		<div class="ring">
			<svg viewBox="0 0 260 260" aria-hidden="true">
				<circle class="track" cx="130" cy="130" r="120"/>
				<circle id="arc" class="arc" cx="130" cy="130" r="120"/>
			</svg>
			<div class="readout">
				<output id="time" aria-live="off">25:00</output>
				<span id="label">Time to focus</span>
			</div>
		</div>

		<div class="controls">
			<button id="resetBtn" class="icon-btn" aria-label="Reset timer">
				<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
			</button>
			<button id="startBtn" class="primary">Start</button>
			<button id="skipBtn" class="icon-btn" aria-label="Skip to next session">
				<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M5 4l10 8-10 8V4zM17 4h2v16h-2V4z"/></svg>
			</button>
		</div>
		<p class="hint">Press Space to start or pause</p>
	</section>

	<section class="card stats" aria-label="Sessions">
		<div>
			<strong id="done">0</strong>
			<span>Sessions done</span>
		</div>
		<div class="dots" id="dots" aria-label="Progress to long break"></div>
		<label class="sound"><input type="checkbox" id="soundToggle" checked> Sound alert</label>
	</section>

	<section class="card tasks" aria-label="Tasks">
		<h2>Tasks</h2>
		<form id="taskForm" autocomplete="off">
			<input id="taskInput" type="text" placeholder="What are you working on?" maxlength="80" aria-label="New task">
			<button class="primary small" type="submit">Add</button>
		</form>
		<ul id="taskList"></ul>
		<p id="empty" class="empty">No tasks yet. Add one to plan your next session.</p>
	</section>
</main>
<script src="index.js"></script>
</body>
</html>
